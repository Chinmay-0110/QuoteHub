<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QuoteHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>QuoteHub ✨</h1>

    <div class="quote-box">
      <p id="quote">Loading...</p>
      <p id="author">—</p>
      <button id="new-quote">Get Random Quote</button>
    </div>

    <hr/>

    <div class="add-quote">
      <h2>Add Your Own Quote</h2>
      <input type="text" id="quote-input" placeholder="Enter quote" />
      <input type="text" id="author-input" placeholder="Enter author" />
      <button id="add-quote">Add Quote</button>
      <p id="add-msg"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
